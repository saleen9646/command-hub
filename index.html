<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APG Command Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#02070c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   APG COMMAND HUB — CONSTELLATION
   Jobs orbit a central core. Color = status, size = open punch.
   (The previous layout lives on as classic.html.)
   ============================================================ */
:root{
  --bg:#02060b; --panel:rgba(4,16,26,.82); --panel2:rgba(0,229,255,.05); --line:rgba(0,229,255,.26);
  --text:#dcfbff; --dim:#76b8c8; --faint:#3a6c78;
  --cyan:#00e5ff; --amber:#ffb340; --green:#3dffb0; --red:#ff4d6d; --violet:#a88bff; --gold:#ffcf6b;
  --gap:10px; --ts:1; --fs:calc(clamp(12px,1.05vw,16px) * var(--ts));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-size:var(--fs);font-weight:500;letter-spacing:.3px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 45%,#071c2a 0%,#02060b 65%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);padding:8px 10px;width:100%;
  -webkit-user-select:text;user-select:text;outline:none}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.25)}
.o{font-family:"Orbitron",sans-serif}

.app{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:var(--gap);padding:var(--gap)}
.main{display:grid;grid-template-columns:minmax(240px,19%) 1fr minmax(280px,22%);gap:var(--gap);min-height:0}
.col{display:flex;flex-direction:column;gap:var(--gap);min-height:0}

/* ---------- HUD panel frame ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  box-shadow:inset 0 0 28px rgba(0,229,255,.06),0 0 14px rgba(0,229,255,.05);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--cyan),var(--cyan)) top left/20px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/2px 20px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) bottom right/20px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 20px no-repeat;
  filter:drop-shadow(0 0 4px var(--cyan))}
.panel[data-tag]::after{content:attr(data-tag);position:absolute;right:24px;bottom:3px;pointer-events:none;font:700 8px "Orbitron";letter-spacing:2px;color:var(--faint)}
.ph{display:flex;align-items:center;gap:8px;padding:11px 14px 6px}
.ph h2{font:700 .66em "Orbitron";letter-spacing:2.5px;color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,.55);white-space:nowrap}
.ph .dia{width:8px;height:8px;transform:rotate(45deg);flex:none;box-shadow:0 0 8px currentColor}
.ph .cnt{margin-left:auto;font:700 .62em "Orbitron";letter-spacing:1.5px;color:var(--dim)}
.pb{flex:1;overflow-y:auto;padding:2px 12px 16px;min-height:0}
.pb::-webkit-scrollbar{width:5px}.pb::-webkit-scrollbar-thumb{background:var(--line)}

/* ---------- top bar ---------- */
.top{flex-direction:row;align-items:center;gap:16px;padding:8px 16px}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke:var(--cyan)}
.ring .r1{stroke-width:1.5;stroke-dasharray:2 5;opacity:.7;transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.ring .r2{stroke-width:3;opacity:.15}.ring .r3{stroke-width:3;filter:drop-shadow(0 0 3px var(--cyan))}
.ring .r4{stroke-width:6;stroke-dasharray:1 5;opacity:.45;transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite reverse}
.ring text{fill:var(--cyan);font:700 17px "Orbitron";text-anchor:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.clock{font:500 2.1em "Orbitron";text-shadow:0 0 14px rgba(0,229,255,.7);color:#e8feff;line-height:1}
.clock small{font:600 .38em "Rajdhani";color:var(--dim);margin-left:3px}
.date b{display:block;font:700 .7em "Orbitron";letter-spacing:2px;color:var(--cyan)}
.date span{color:var(--dim)}
.quote{flex:1;min-width:0;text-align:center;cursor:pointer;padding:0 10px}
.qt{font-weight:600;font-size:1.1em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa{margin-top:3px;font:700 .58em "Orbitron";letter-spacing:2.5px;color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,.5)}
.health{display:flex;flex-direction:column;gap:2px;width:190px;flex:none}
.health .hl{display:flex;justify-content:space-between;font:700 .55em "Orbitron";letter-spacing:2px;color:var(--dim)}
.health .hl b{color:var(--green)}
.health svg{width:100%;height:26px}
.wx{display:flex;align-items:center;gap:10px;padding:5px 12px;border:1px solid var(--line);background:var(--panel2);flex:none}
.wx .t{font:700 1.4em "Orbitron"}.wx .s{color:var(--dim);font-size:.8em;line-height:1.25}
.ibtn{width:42px;height:42px;border:1px solid var(--line);background:var(--panel2);font:700 .62em "Orbitron";letter-spacing:1px;color:var(--cyan);flex:none}
.ibtn.off{color:var(--faint)}

/* ---------- lists (to-do + punch) ---------- */
.addrow{display:flex;gap:6px;padding:0 12px 8px}
.addrow input{padding:8px 10px}
.addrow button{flex:none;width:40px;border:1px solid var(--cyan);color:var(--cyan);background:rgba(0,229,255,.12);font-weight:700;font-size:1.2em}
.it{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(0,229,255,.1);min-height:42px}
.chk{width:26px;height:26px;flex:none;border:2px solid var(--cyan);display:grid;place-items:center;color:#02060b;font-weight:800}
.it.done .chk{background:var(--green);border-color:var(--green);box-shadow:0 0 10px var(--green)}
.it .tx{flex:1;line-height:1.25}
.it.done .tx{text-decoration:line-through;color:var(--faint)}
.it .x{width:30px;height:30px;color:var(--faint);flex:none}
.clr{margin-top:8px;width:100%;height:34px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:.9em}
.empty{color:var(--faint);text-align:center;padding:18px 6px;line-height:1.5}

/* attention */
.sig{display:flex;gap:9px;align-items:flex-start;padding:6px 2px;cursor:pointer;line-height:1.25;font-size:.95em}
.sig i{font-style:normal;flex:none;width:16px;text-align:center}
.sig.a i{color:var(--amber)}.sig.g i{color:var(--green)}.sig.c i{color:var(--cyan)}.sig.r i{color:var(--red)}

/* ---------- center: constellation ---------- */
.stage{padding:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.ov{position:absolute;z-index:2}
.legend{top:12px;left:16px;font:700 .55em "Orbitron";letter-spacing:2px;color:var(--dim);line-height:2}
.legend b{display:inline-block;width:8px;height:8px;transform:rotate(45deg);margin-right:8px;box-shadow:0 0 6px currentColor}
.views{top:10px;right:14px;display:flex;gap:6px;z-index:4}
.views button,.addjob{height:32px;padding:0 12px;border:1px solid var(--line);background:rgba(2,10,16,.7);font:700 .58em "Orbitron";letter-spacing:2px;color:var(--dim)}
.views button.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.3)}
.addjob{color:var(--cyan)}
.feed{left:14px;bottom:12px;width:min(360px,46%);background:rgba(2,10,16,.72);border:1px solid rgba(0,229,255,.18);padding:8px 10px}
.feed h3{font:700 .55em "Orbitron";letter-spacing:2.5px;color:var(--cyan);margin-bottom:4px;display:flex;justify-content:space-between}
.feed h3 span{color:var(--green)}
.feed .fl{font-size:.8em;color:var(--dim);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .fl em{font-style:normal;color:var(--faint);margin-right:6px;font-family:"Orbitron";font-size:.85em}
.feed .fl b{color:var(--text);font-weight:600}
.tapnote{right:16px;bottom:12px;font:700 .52em "Orbitron";letter-spacing:2px;color:var(--faint)}
.tiles{position:absolute;inset:0;padding:54px 14px 18px;z-index:3;display:none;overflow-y:auto;background:rgba(2,8,14,.95);
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;align-content:start}
.tiles.on{display:grid}
.tile{border:1px solid var(--line);background:rgba(2,14,22,.85);padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:110px}
.tile .n{font:700 1.25em "Orbitron";color:#e8feff}.tile .nm{font-weight:700;line-height:1.2}.tile .cl{color:var(--dim);font-size:.85em}
.tile.dimmed{opacity:.45}
.pill{align-self:flex-start;margin-top:auto;font:700 .55em "Orbitron";letter-spacing:1.5px;padding:3px 7px;border:1px solid currentColor}

/* ---------- right: selected job ---------- */
.jobhead{padding:0 14px 8px;border-bottom:1px solid rgba(0,229,255,.12)}
.jobhead .jn{font:700 2em "Orbitron";color:#e8feff;text-shadow:0 0 12px rgba(0,229,255,.5);line-height:1.1}
.jobhead .jt{font-weight:700;font-size:1.1em;line-height:1.2;margin-top:2px}
.jobhead .jc{color:var(--dim);font-size:.9em}
.jobhead .jr{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sbtn{height:30px;padding:0 10px;border:1px solid var(--line);background:var(--panel2);font:700 .55em "Orbitron";letter-spacing:1.5px;color:var(--dim)}
.sbtn:active,.addrow button:active,.tb:active,.ibtn:active,.views button:active{box-shadow:0 0 16px rgba(0,229,255,.7);border-color:var(--cyan)}
.prog{height:4px;background:rgba(0,229,255,.12);margin-top:8px}.prog i{display:block;height:100%;background:var(--green);box-shadow:0 0 8px var(--green)}
.psub{display:flex;justify-content:space-between;font:700 .52em "Orbitron";letter-spacing:2px;color:var(--faint);margin-top:4px}

/* timer */
.tbig{font:500 1.9em "Orbitron";text-align:center;text-shadow:0 0 14px currentColor;color:#e8feff}
.tbig.run{color:var(--amber)}.tbig.up{color:var(--cyan)}.tbig.done{color:var(--red);animation:blink .6s steps(2) infinite}
.tbig.paused{color:var(--dim);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.tbarw{height:5px;margin:4px 0 8px;background:rgba(255,179,64,.12);border:1px solid rgba(255,179,64,.3)}
.tbar{height:100%;width:0;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tbtns{display:grid;grid-template-columns:repeat(4,1fr) .8fr;gap:5px}
.tbtns.run2{grid-template-columns:1.4fr 1fr;display:none}
.tb{height:34px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.tb.pz{color:var(--amber);border-color:rgba(255,179,64,.5)}.tb.pz.go{color:var(--green);border-color:rgba(61,255,176,.5)}
.tb.st{color:var(--red);border-color:rgba(255,77,109,.5)}
.tlbl{text-align:center;color:var(--dim);font-size:.78em;margin-top:5px;min-height:1.2em}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.scrim.open{display:flex}
.modal{background:#04121b;border:1px solid var(--cyan);box-shadow:0 0 30px rgba(0,229,255,.25);width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h3{font:700 .9em "Orbitron";letter-spacing:2px;color:var(--cyan);margin-bottom:14px}
.fld{margin-bottom:10px}.fld label{display:block;font:700 .55em "Orbitron";letter-spacing:2px;color:var(--dim);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{height:42px;padding:0 16px;border:1px solid var(--line);background:var(--panel2);font:700 .62em "Orbitron";letter-spacing:1.5px}
.btn.pri{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.15)}
.btn.del{color:var(--red);margin-right:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#04121b;border:1px solid var(--cyan);color:var(--cyan);
  padding:9px 16px;font:700 .65em "Orbitron";letter-spacing:1.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:25;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}

/* ---------- installed-app title bar (when hidden with Chrome's ^) ---------- */
.titlebar{display:none}
@media (display-mode: window-controls-overlay){
  .titlebar{display:flex;align-items:center;gap:8px;position:fixed;z-index:35;
    left:env(titlebar-area-x,0);top:env(titlebar-area-y,0);width:env(titlebar-area-width,100%);height:env(titlebar-area-height,32px);
    padding:0 12px;-webkit-app-region:drag;app-region:drag;font:700 10px "Orbitron",sans-serif;letter-spacing:3px;color:var(--faint)}
  .titlebar img{width:16px;height:16px}
  .app{padding-top:calc(env(titlebar-area-height,32px) + 2px)}
}
/* ---------- Spotify panel (optional, Settings) ---------- */
body.nosp #spPanel{display:none}
.spdev{margin-left:auto;color:var(--faint);font-size:.75em;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{display:flex;flex-direction:column;gap:8px}
.spnow{display:flex;gap:10px;align-items:center;min-width:0}
.art{width:52px;height:52px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--panel2)}
.meta{flex:1;min-width:0}
.meta .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .ar{color:var(--dim);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.sp .prog{height:4px;margin:0;background:rgba(0,229,255,.12)}.sp .prog .fill{height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.times{display:flex;justify-content:space-between;color:var(--faint);font:700 .55em "Orbitron";margin-top:3px}
.spctl{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:5px}
.spctl button{height:34px;border:1px solid var(--line);background:var(--panel2)}
.spctl .pp{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.15)}
.spmsg{color:var(--dim);text-align:center;line-height:1.4;padding:6px}
.spbtn{display:block;margin:8px auto 0;height:38px;padding:0 18px;border:1px solid var(--cyan);color:var(--cyan);background:rgba(0,229,255,.15);font:700 .6em "Orbitron";letter-spacing:2px}
.path{font-family:Consolas,monospace;font-size:.85em;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:8px 10px;word-break:break-all;color:var(--dim);-webkit-user-select:text;user-select:text}
.hint{color:var(--faint);font-size:.8em;margin-top:5px;line-height:1.4}
.modal h4{font:700 .62em "Orbitron";letter-spacing:2px;color:var(--cyan);margin:16px 0 8px}
@media (max-width:1250px){ .health{display:none} }
@media (max-width:1000px){ .main{grid-template-columns:210px 1fr 240px} .wx .s{display:none} }
</style>
</head>
<body>
<div class="titlebar"><img src="icon.svg" alt="">APG COMMAND HUB</div>
<div class="app">
  <!-- ===== TOP BAR ===== -->
  <header class="panel top">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="r1" cx="50" cy="50" r="46"/><circle class="r2" cx="50" cy="50" r="37"/>
      <circle class="r3" id="secArc" cx="50" cy="50" r="37" stroke-dasharray="232.5" stroke-dashoffset="232.5" transform="rotate(-90 50 50)"/>
      <circle class="r4" cx="50" cy="50" r="27"/><text x="50" y="56" id="ringTxt">00</text>
    </svg>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="quote" id="quote" title="Tap for another quote"><div class="qt" id="qt"></div><div class="qa" id="qa"></div></div>
    <div class="health"><div class="hl"><span>PUNCH CLEARED</span><b id="hPct">--%</b></div>
      <svg viewBox="0 0 190 26" preserveAspectRatio="none"><polyline id="hLine" fill="none" stroke="#3dffb0" stroke-width="1.6" style="filter:drop-shadow(0 0 3px #3dffb0)"/></svg></div>
    <div class="wx"><div class="t" id="wxT">--°</div><div class="s" id="wxS">Weather<br>loading…</div></div>
    <button class="ibtn" id="fxBtn" title="Motion effects on/off">FX</button>
    <button class="ibtn" id="gear" title="Settings" style="font-size:1.1em">⚙</button>
  </header>

  <section class="main">
    <!-- ===== LEFT: attention + to-do ===== -->
    <div class="col">
      <div class="panel" data-tag="SIG // ATTENTION" style="flex:none;max-height:38%">
        <div class="ph"><span class="dia" style="color:var(--amber);background:var(--amber)"></span><h2>Attention</h2></div>
        <div class="pb" id="sig"></div>
      </div>
      <div class="panel" data-tag="MOD-01 // TO-DO" style="flex:1">
        <div class="ph"><span class="dia" style="color:var(--cyan);background:var(--cyan)"></span><h2>To-Do</h2><span class="cnt" id="todoCnt"></span></div>
        <form class="addrow" id="todoForm"><input id="todoIn" placeholder="Add a to-do…" autocomplete="off"><button>+</button></form>
        <div class="pb" id="todo"></div>
      </div>
    </div>

    <!-- ===== CENTER: constellation ===== -->
    <div class="panel stage" data-tag="MOD-02 // ACTIVE OPS">
      <canvas id="cv"></canvas>
      <div class="ov legend"><div><b style="color:var(--cyan);background:var(--cyan)"></b>ACTIVE</div>
        <div><b style="color:var(--amber);background:var(--amber)"></b>PUNCH</div><div style="color:var(--faint)">SIZE = OPEN PUNCH ITEMS</div></div>
      <div class="ov views"><button class="on" id="vOrbit">◉ ORBIT</button><button id="vTiles">▦ ALL JOBS</button><button class="addjob" id="addJob">+ JOB</button></div>
      <div class="tiles" id="tiles"></div>
      <div class="ov feed"><h3>SYSTEM FEED <span>● LIVE</span></h3><div id="feed"></div></div>
      <div class="ov tapnote">TAP A JOB TO OPEN IT</div>
    </div>

    <!-- ===== RIGHT: selected job + timer ===== -->
    <div class="col">
      <div class="panel" data-tag="MOD-03 // SELECTED JOB" style="flex:1">
        <div class="ph"><span class="dia" id="selDia" style="color:var(--cyan);background:var(--cyan)"></span><h2>Selected Job</h2></div>
        <div id="jobBox" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
      </div>
      <div class="panel" id="spPanel" data-tag="MOD-05 // AUDIO" style="flex:none">
        <div class="ph"><span class="dia" style="color:#1db954;background:#1db954"></span><h2>Spotify</h2><span class="spdev" id="spDev"></span></div>
        <div class="pb sp" id="sp"></div><div id="eq" style="display:none"></div>
      </div>
      <div class="panel" data-tag="MOD-06 // CHRONO" style="flex:none">
        <div class="ph"><span class="dia" style="color:var(--red);background:var(--red)"></span><h2>Timer</h2></div>
        <div style="padding:0 12px 16px">
          <div class="tbig" id="tDisp">00:00</div>
          <div class="tbarw"><div class="tbar" id="tBar"></div></div>
          <div class="tbtns" id="tIdle"><button class="tb" data-m="5">5m</button><button class="tb" data-m="15">15m</button>
            <button class="tb" data-m="30">30m</button><button class="tb" data-m="60">1h</button><button class="tb" id="tSw" title="Stopwatch">⏱</button></div>
          <div class="tbtns run2" id="tRun"><button class="tb pz" id="tPause">Pause</button><button class="tb st" id="tStop">Stop</button></div>
          <div class="tlbl" id="tLbl"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA (preview uses its own sample data, saved in this browser)
   ============================================================ */
const KEY = "apgHub.v2";                      // new layout's saved data
const OLD_KEY = "apgHub.v1";                  // the previous hub's saved data (left untouched)
let uid = Date.now();
const nid = () => ++uid;
const QUOTES = [

function wrap(text, max, font){ ctx.font = font; const words = text.split(" "), lines=[]; let cur="";
  for (const w of words){ const t = cur ? cur+" "+w : w; if (ctx.measureText(t).width > max && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); if (lines.length > 2){ lines.length = 2; lines[1] = lines[1].replace(/\s*\S*$/,"") + "…"; } return lines; }
function draw(now){
  if (!bgCanvas || !W) return;
  const t = now/1000, fx = S.fx;
  ctx.clearRect(0,0,W,H); ctx.drawImage(bgCanvas,0,0,W,H);
  const TS = textScale(), cx = W*.5, cy = H*.42 - (TS-1)*H*.06, rx = Math.min(W*.37, W/2-110*TS), ry = Math.min(H*.27, H/2-90*TS) - (TS-1)*H*.05, R = Math.min(W,H)*.12;
  // stars
  ctx.globalCompositeOperation = "lighter";
  for (const s of stars){ if (fx){ s.x -= s.s*.08; if (s.x < 0) s.x += W; }
    const a = .35 + .35*Math.sin(t*s.s*2 + s.p); ctx.fillStyle = `rgba(190,235,255,${a})`; ctx.fillRect(s.x, s.y, s.r, s.r); }
  // orbit rings
  ctx.globalCompositeOperation = "source-over";
  [[1,.22,"0,229,255"],[.78,.14,"168,139,255"],[1.18,.1,"255,179,64"]].forEach(([k,a,c],i) => {
    ctx.save(); ctx.translate(cx,cy); ctx.rotate((i-1)*.12 + (fx? t*.02*(i%2?1:-1) : 0));
    ctx.setLineDash([2,7]); ctx.lineDashOffset = fx ? -t*12*(i+1) : 0; ctx.strokeStyle = `rgba(${c},${a})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0,0,rx*k,ry*k,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); });
  ctx.setLineDash([]);
  // node positions
  if (fx) orbitBase += .0006;
  nodes.forEach(n => { const a = n.a0 + orbitBase; n.x = cx + Math.cos(a)*rx; n.y = cy + Math.sin(a)*ry;
    const o = openFor(n.id); n.r = 14 + Math.min(o,8)*2.4; });
  // trails core -> node, with flowing particles
  ctx.globalCompositeOperation = "lighter";
  nodes.forEach((n,i) => { const j = jobById(n.id); if (!j) return; const col = STC[j.status];
    const mx = (cx+n.x)/2, my = (cy+n.y)/2, dx = n.x-cx, dy = n.y-cy, k = .22*(i%2?1:-1), qx = mx - dy*k, qy = my + dx*k;
    const g = ctx.createLinearGradient(cx,cy,n.x,n.y); g.addColorStop(0,"rgba(255,170,80,.5)"); g.addColorStop(1,col+"aa");
    ctx.strokeStyle = g; ctx.lineWidth = n.id===S.selected ? 2.2 : 1.2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.quadraticCurveTo(qx,qy,n.x,n.y); ctx.stroke();
    if (fx) for (let p=0;p<3;p++){ const u = ((t*.25 + p/3 + i*.13) % 1), iu = 1-u;
      const px = iu*iu*cx + 2*iu*u*qx + u*u*n.x, py = iu*iu*cy + 2*iu*u*qy + u*u*n.y; ctx.drawImage(sprite(col,18), px-9, py-9, 18, 18); } });
  // core sphere
  ctx.drawImage(sprite("#ff9a3c", Math.round(R*5)), cx-R*2.5, cy-R*2.5, R*5, R*5);
  ctx.drawImage(sprite("#ffffff", Math.round(R*1.6)), cx-R*.8, cy-R*.8, R*1.6, R*1.6);
  const ay = fx ? t*.18 : .6, ax = .35, P = CORE.pts.map(p => rot(p, ay, ax));
  ctx.lineWidth = .7;
  for (const [i,j] of CORE.pairs){ const a=P[i], b=P[j], z=(a[2]+b[2])/2; const al = .12 + (z+1)*.22;
    ctx.strokeStyle = z > 0 ? `rgba(255,200,120,${al})` : `rgba(150,120,255,${al*.8})`; ctx.beginPath(); ctx.moveTo(cx+a[0]*R, cy+a[1]*R); ctx.lineTo(cx+b[0]*R, cy+b[1]*R); ctx.stroke(); }
  for (const p of P){ const s = 1.2 + (p[2]+1)*.9; ctx.fillStyle = p[2] > 0 ? "rgba(255,235,200,.9)" : "rgba(170,150,255,.6)"; ctx.fillRect(cx+p[0]*R-s/2, cy+p[1]*R-s/2, s, s); }
  ctx.globalCompositeOperation = "source-over";
  ctx.textAlign = "center"; ctx.fillStyle = "#ffd59a"; ctx.font = `700 ${Math.max(10,R*.16)*TS}px Orbitron`; ctx.shadowColor = "#ff9a3c"; ctx.shadowBlur = 10;
  ctx.fillText("APG CORE", cx, cy + R + 22); ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,213,154,.6)"; ctx.font = `600 ${Math.max(10,R*.15)*TS}px Rajdhani`; ctx.fillText(`${nodes.length} ACTIVE OPS`, cx, cy + R + 22 + 16*TS);
  // job nodes
  nodes.forEach(n => { const j = jobById(n.id); if (!j) return; const col = STC[j.status], sel = n.id === S.selected, hov = n.id === hoverId;
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(sprite(col, 160), n.x - n.r*2.6, n.y - n.r*2.6, n.r*5.2, n.r*5.2);
    if (sel) ctx.drawImage(sprite(col, 160), n.x - n.r*3.4, n.y - n.r*3.4, n.r*6.8, n.r*6.8);
    // wireframe gem
    const sa = fx ? t*.6 + n.spin : n.spin, V = ICO.v.map(p => rot(p, sa, .5));
    ctx.strokeStyle = col; ctx.lineWidth = sel ? 1.6 : 1.1; ctx.beginPath();
    for (const [a,b] of ICO.e){ ctx.moveTo(n.x+V[a][0]*n.r, n.y+V[a][1]*n.r); ctx.lineTo(n.x+V[b][0]*n.r, n.y+V[b][1]*n.r); } ctx.stroke();
    ctx.drawImage(sprite("#ffffff", 40), n.x-8, n.y-8, 16, 16);
    // open punch items as orbiting satellites
    const open = S.punch.filter(p => p.job === n.id && !p.done).length;
    for (let k=0;k<Math.min(open,10);k++){ const a = (fx ? t*.5 : 0) + k*2*Math.PI/Math.min(open,10), rr = n.r + 13;
      const sx = n.x + Math.cos(a)*rr, sy = n.y + Math.sin(a)*rr*.85; ctx.drawImage(sprite(col, 20), sx-6, sy-6, 12, 12); }
    ctx.globalCompositeOperation = "source-over";
    if (sel || hov){ ctx.save(); ctx.translate(n.x,n.y); ctx.rotate(fx ? t*.4 : 0); ctx.setLineDash([4,6]); ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0,0,n.r+24,0,Math.PI*2); ctx.stroke(); ctx.restore(); ctx.setLineDash([]); }
    // label
    const ly = n.y + n.r + 16 + 14*TS;
    ctx.textAlign = "center"; ctx.shadowColor = col; ctx.shadowBlur = sel ? 14 : 8;
    ctx.fillStyle = "#eafcff"; ctx.font = `700 ${(sel?17:15)*TS}px Orbitron`; ctx.fillText(j.num, n.x, ly); ctx.shadowBlur = 0;
    const lines = wrap(j.name, 170*TS, `600 ${13*TS}px Rajdhani`); ctx.fillStyle = sel ? "#cdeff7" : "rgba(190,225,236,.9)";
    lines.forEach((l,i) => ctx.fillText(l, n.x, ly + 16*TS + i*14*TS));
    ctx.fillStyle = col; ctx.font = `700 ${9.5*TS}px Orbitron`;
    ctx.fillText(open ? `${open} OPEN · ${j.status.toUpperCase()}` : `CLEAR · ${j.status.toUpperCase()}`, n.x, ly + 18*TS + lines.length*14*TS + 2);
  });
  if (!nodes.length){ ctx.fillStyle = "#76b8c8"; ctx.font = "600 15px Rajdhani"; ctx.textAlign = "center"; ctx.fillText("No Active or Punch jobs — tap + JOB", cx, cy + R + 70); }
}
function hit(e){ const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 1e9; nodes.forEach(n => { const d = Math.hypot(n.x-x, n.y-y); if (d < n.r + 34 && d < bd){ bd = d; best = n; } }); return best; }
cv.addEventListener("pointerdown", e => { const n = hit(e); if (n) select(n.id); });
cv.addEventListener("pointermove", e => { const n = hit(e); hoverId = n ? n.id : null; cv.style.cursor = n ? "pointer" : "default"; });
let last = 0;
function loop(now){ if (!tilesOn && (S.fx || now - last > 1000)){ draw(now); last = now; } requestAnimationFrame(loop); }
new ResizeObserver(resize).observe(cv);

/* ============================================================
   SPOTIFY — remote control for whatever Spotify is playing
   (sign-in uses Spotify's "PKCE" method: no password or secret
    is ever stored here, only a temporary pass from Spotify)
   ============================================================ */
const SPKEY = "apgHub.v1.spotify";   // shared with the classic hub, so your sign-in carries over
let SPS = { clientId:"", access:"", refresh:"", exp:0 };
try { Object.assign(SPS, JSON.parse(localStorage.getItem(SPKEY)) || {}); } catch(e){}
function spSave(){ try { localStorage.setItem(SPKEY, JSON.stringify(SPS)); } catch(e){} }
function spClear(){ SPS.access = SPS.refresh = ""; SPS.exp = 0; spSave(); spState = null; }
function spRedirect(){ return location.origin + location.pathname; }
const SCOPES = "user-read-playback-state user-modify-playback-state user-read-currently-playing";
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function spLogin(){
  if (location.protocol === "file:") return toast("Sign-in only works from the hosted version");
  if (!window.crypto || !crypto.subtle) return toast("This browser can't do the secure sign-in here");
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  try { localStorage.setItem(SPKEY + ".v", verifier); } catch(e){}
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: SPS.clientId, response_type: "code", redirect_uri: spRedirect(), scope: SCOPES,
    code_challenge_method: "S256", code_challenge: challenge });
}
async function spTokenCall(params){
  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: new URLSearchParams(params) });
  if (!r.ok) throw new Error("token " + r.status);
  const j = await r.json();
  SPS.access = j.access_token; if (j.refresh_token) SPS.refresh = j.refresh_token;
  SPS.exp = Date.now() + j.expires_in * 1000; spSave();
}
async function spHandleReturn(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", spRedirect());          // tidy the address bar
  if (q.has("error")) return toast("Spotify sign-in was cancelled");
  let verifier = ""; try { verifier = localStorage.getItem(SPKEY + ".v") || ""; } catch(e){}
  try { await spTokenCall({ grant_type:"authorization_code", code:q.get("code"), redirect_uri:spRedirect(),
          client_id:SPS.clientId, code_verifier:verifier }); toast("Spotify connected"); }
  catch(e){ toast("Spotify sign-in failed — check the Client ID and redirect URI"); }
}
async function spToken(){
  if (!SPS.access) return null;
  if (Date.now() > SPS.exp - 60000){
    try { await spTokenCall({ grant_type:"refresh_token", refresh_token:SPS.refresh, client_id:SPS.clientId }); }
    catch(e){ spClear(); renderSpotify(); return null; }
  }
  return SPS.access;
}
async function spApi(method, path){
  const t = await spToken(); if (!t) return { status: 0 };
  try {
    const r = await fetch("https://api.spotify.com/v1" + path, { method, headers:{ Authorization:"Bearer " + t } });
    if (r.status === 401){ SPS.exp = 0; spSave(); }
    let data = null; if (r.status !== 204){ try { data = await r.json(); } catch(e){} }
    return { status: r.status, data };
  } catch(e){ return { status: -1 }; }
}

let spState = null, spPolledAt = 0, spBusy = false;
const mmss = ms => { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
async function spPoll(){
  if (!SPS.access || document.hidden || !S.showSpotify) return;
  const r = await spApi("GET", "/me/player?additional_types=episode");
  if (r.status === 200 && r.data) spState = r.data;
  else if (r.status === 204) spState = { idle: true };
  else if (r.status === 403) spState = { err: "Spotify refused the request. This needs Spotify Premium on the account that made the developer app." };
  spPolledAt = Date.now(); renderSpotify();
}
function spMsg(html, btn){ $("#sp").innerHTML = `<div class="spmsg">${html}</div>${btn || ""}`; $("#spDev").textContent = ""; }
function renderSpotify(){
  $("#eq").classList.toggle("on", !!(SPS.access && spState && spState.is_playing && spState.item));
  const el = $("#sp");
  if (!SPS.clientId) return spMsg(`Not set up yet.<br>Add your Spotify Client ID in <b>⚙ Settings</b>.`);
  if (!SPS.access){
    spMsg(location.protocol === "file:" ? `Open the hosted version of the hub to connect Spotify.` : `Ready to connect.`,
      location.protocol === "file:" ? "" : `<button class="spbtn" id="spIn">Connect Spotify</button>`);
    const b = $("#spIn"); if (b) b.onclick = spLogin; return;
  }
  if (!spState) return spMsg("Loading…");
  if (spState.err) return spMsg(esc(spState.err));
  if (spState.idle || !spState.item) return spMsg(`Nothing playing right now.<br>Start Spotify on any device and it'll show up here.`);
  const it = spState.item, isEp = it.type === "episode";
  const art = (isEp ? it.images : it.album && it.album.images) || [];
  const img = art.length ? art[art.length > 1 ? 1 : 0].url : "";
  const who = isEp ? (it.show && it.show.name) : (it.artists || []).map(a => a.name).join(", ");
  let prog = spState.progress_ms || 0;
  if (spState.is_playing) prog += Date.now() - spPolledAt;
  prog = Math.min(prog, it.duration_ms);
  $("#spDev").textContent = spState.device ? "on " + spState.device.name : "";
  el.innerHTML = `<div class="spnow">${img ? `<img class="art" src="${esc(img)}" alt="">` : `<div class="art"></div>`}
      <div class="meta"><div class="tt">${esc(it.name)}</div><div class="ar">${esc(who)}</div>
        <div class="prog"><div class="fill" style="width:${(prog/it.duration_ms*100).toFixed(1)}%"></div></div>
        <div class="times"><span>${mmss(prog)}</span><span>${mmss(it.duration_ms)}</span></div></div></div>
    <div class="spctl">
      <button data-a="vdn" title="Volume down">🔉</button><button data-a="prev" title="Previous">⏮</button>
      <button class="pp" data-a="pp" title="Play / pause">${spState.is_playing ? "⏸" : "▶"}</button>
      <button data-a="next" title="Next">⏭</button><button data-a="vup" title="Volume up">🔊</button></div>`;
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => spDo(b.dataset.a));
}
async function spDo(a){
  if (spBusy) return; spBusy = true;
  const vol = spState && spState.device ? spState.device.volume_percent : null;
  let r;
  if (a === "pp"){ r = await spApi("PUT", spState.is_playing ? "/me/player/pause" : "/me/player/play");
    if (r.status >= 200 && r.status < 300){ spState.progress_ms += spState.is_playing ? Date.now() - spPolledAt : 0; spPolledAt = Date.now(); spState.is_playing = !spState.is_playing; renderSpotify(); } }
  else if (a === "next") r = await spApi("POST", "/me/player/next");
  else if (a === "prev") r = await spApi("POST", "/me/player/previous");
  else if (vol == null) r = { status: 400, nov: true };
  else r = await spApi("PUT", "/me/player/volume?volume_percent=" + Math.max(0, Math.min(100, vol + (a === "vup" ? 10 : -10))));
  if (r.nov) toast("This device doesn't allow volume control from here");
  else if (r.status === 404) toast("No active device — press play in Spotify once first");
  else if (r.status === 403) toast("Spotify said no — Premium is required, or that device blocks remote control");
  else if (r.status === -1) toast("Couldn't reach Spotify");
  spBusy = false;
  setTimeout(spPoll, 450);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) spPoll(); });

/* ============================================================
   SETTINGS — weather, quotes, motion, Spotify
   ============================================================ */
function copy(text, msg){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast(msg || "COPIED")).catch(() => toast("COULDN'T COPY"));
}
$("#gear").onclick = () => openModal(`<h3>SETTINGS</h3>
  <h4>WEATHER</h4>
  <div class="fld"><label>LOCATION NAME</label><input id="wN" value="${esc(S.weather.name)}"></div>
  <div class="row2"><div class="fld"><label>LATITUDE</label><input id="wA" value="${S.weather.lat}"></div>
    <div class="fld"><label>LONGITUDE</label><input id="wO" value="${S.weather.lon}"></div></div>
  <div class="hint">Tip: right-click a spot in Google Maps — the first line is latitude, longitude.</div>
  <h4>DAILY QUOTES</h4>
  <div class="fld"><textarea id="qList" style="min-height:120px">${esc(S.quotes.join("\n"))}</textarea>
    <div class="hint">One per line. End a line with " — Name" to credit someone other than John C. Maxwell.</div></div>
  <h4>LOOK</h4>
  <div class="fld"><label>TEXT SIZE</label><select id="tsSel">
    <option value="normal" ${S.textSize==="normal"?"selected":""}>Normal</option>
    <option value="large" ${(!S.textSize||S.textSize==="large")?"selected":""}>Large</option>
    <option value="xl" ${S.textSize==="xl"?"selected":""}>Extra large</option></select></div>
  <div class="row2"><div class="fld"><label>MOTION EFFECTS</label><select id="fxSel"><option value="on" ${S.fx?"selected":""}>On</option><option value="off" ${!S.fx?"selected":""}>Off (calmer)</option></select></div>
    <div class="fld"><label>CLASSIC LAYOUT</label><a class="btn" href="classic.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--dim)">OPEN CLASSIC</a></div></div>
  <h4>SPOTIFY</h4>
  <div class="fld"><label>SHOW SPOTIFY PANEL</label><select id="spShow"><option value="off" ${!S.showSpotify?"selected":""}>Off (use the Spotify app)</option><option value="on" ${S.showSpotify?"selected":""}>On</option></select></div>
  <div class="fld"><label>SPOTIFY CLIENT ID</label><input id="spId" value="${esc(SPS.clientId)}" placeholder="From developer.spotify.com"></div>
  <div class="fld"><label>REDIRECT URI</label><div class="path">${esc(spRedirect())}</div></div>
  <div class="acts" style="margin-top:6px"><button class="btn" id="spCopy">COPY REDIRECT URI</button>${SPS.access ? `<button class="btn" id="spOut">DISCONNECT</button>` : ""}</div>
  <div class="acts"><button class="btn" id="c" style="margin-left:auto">CANCEL</button><button class="btn pri" id="s">SAVE</button></div>`, m => {
    m.querySelector("#c").onclick = closeModal;
    m.querySelector("#spCopy").onclick = () => copy(spRedirect(), "REDIRECT URI COPIED");
    const so = m.querySelector("#spOut"); if (so) so.onclick = () => { spClear(); renderSpotify(); closeModal(); };
    m.querySelector("#s").onclick = () => {
      const lat = parseFloat(m.querySelector("#wA").value), lon = parseFloat(m.querySelector("#wO").value);
      if (isNaN(lat) || isNaN(lon)) return toast("LAT / LONG MUST BE NUMBERS");
      S.weather = { name: m.querySelector("#wN").value.trim() || "Weather", lat, lon };
      S.quotes = m.querySelector("#qList").value.split("\n").map(x => x.trim()).filter(Boolean);
      if (!S.quotes.length) S.quotes = QUOTES.slice();
      S.fx = m.querySelector("#fxSel").value === "on";
      S.textSize = m.querySelector("#tsSel").value;
      S.showSpotify = m.querySelector("#spShow").value === "on";
      const id = m.querySelector("#spId").value.trim();
      if (id !== SPS.clientId){ spClear(); SPS.clientId = id; spSave(); }
      save(); applyFx(); loadWeather(); renderQuote(); renderSpotify(); spPoll(); closeModal();
    };
  });

/* ============================================================
   START
   ============================================================ */
const TEXT_SIZES = { normal:1, large:1.2, xl:1.4 };
function textScale(){ return TEXT_SIZES[S.textSize] || 1.2; }
function applyText(){ document.documentElement.style.setProperty("--ts", textScale()); }
function applyFx(){ applyText(); document.body.classList.toggle("nosp", !S.showSpotify); $("#fxBtn").classList.toggle("off", !S.fx); document.querySelectorAll(".ring .r1,.ring .r4").forEach(e => e.style.animationPlayState = S.fx ? "running" : "paused"); }
$("#fxBtn").onclick = () => { S.fx = !S.fx; save(); applyFx(); toast(S.fx ? "MOTION ON" : "MOTION OFF"); };
function refreshAll(){ renderSignals(); renderTodo(); renderJob(); renderFeed(); renderHealth(); if (tilesOn) renderTiles(); }
if (!S.feed.length){ S.feed = [{t:"--:--",h:"Command Hub online"}]; }
applyFx(); tickClock(); renderQuote(); refreshAll(); loadWeather(); layoutNodes();
setInterval(tickClock, 1000); setInterval(tickTimer, 250); setInterval(renderHealth, 2000); setInterval(loadWeather, 15*60*1000);
tickTimer(); requestAnimationFrame(loop);
spHandleReturn().then(() => { renderSpotify(); spPoll(); });
setInterval(spPoll, 5000);
setInterval(() => { if (S.showSpotify && spState && spState.is_playing) renderSpotify(); }, 1000);
</script>
